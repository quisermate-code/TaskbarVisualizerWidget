Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=13

[MeasureBand14]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=14

[MeasureBand15]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=15

; Clamped Bar Heights (Minimum 2px for clean resting dot)
[MeasureBar0]
Measure=Calc
Formula=Clamp(Round([MeasureBand0] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar1]
Measure=Calc
Formula=Clamp(Round([MeasureBand1] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar2]
Measure=Calc
Formula=Clamp(Round([MeasureBand2] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar3]
Measure=Calc
Formula=Clamp(Round([MeasureBand3] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar4]
Measure=Calc
Formula=Clamp(Round([MeasureBand4] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar5]
Measure=Calc
Formula=Clamp(Round([MeasureBand5] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar6]
Measure=Calc
Formula=Clamp(Round([MeasureBand6] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar7]
Measure=Calc
Formula=Clamp(Round([MeasureBand7] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar8]
Measure=Calc
Formula=Clamp(Round([MeasureBand8] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar9]
Measure=Calc
Formula=Clamp(Round([MeasureBand9] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar10]
Measure=Calc
Formula=Clamp(Round([MeasureBand10] * #BarMaxHeight#), 2, #BarMaxHeight#)
