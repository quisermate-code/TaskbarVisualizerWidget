[MeasureBar15]
Measure=Calc
Formula=Clamp(Round([MeasureBand15] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

; -------------------------------------------------------------------
; METERS - Bottom-Anchored Minimalist Layout
; -------------------------------------------------------------------

; === Background Surface & Middle-Click Size Cycle ===
[MeterBackground]
Meter=Shape
X=0
Y=0
W=#WidgetWidth#
H=#WidgetHeight#
Shape=Rectangle 0.5, 0.5, (#WidgetWidth#-1), (#WidgetHeight#-1), #WidgetRadius# | Fill Color #BgColor# | StrokeWidth #WidgetBorderWidth# | Stroke Color #BorderColor#
MouseScrollUpAction=[!CommandMeasure MeasureWin7Audio "ChangeVolume +2"]
MouseScrollDownAction=[!CommandMeasure MeasureWin7Audio "ChangeVolume -2"]
LeftMouseUpAction=[!CommandMeasure MeasureWebState "PlayPause"]
MiddleMouseUpAction=[!WriteKeyValue Variables Scale "(#Scale# >= 1.6 ? 1.0 : (Round((#Scale# + 0.15) * 100) / 100))" "#@#Variables.inc"][!Refresh]

; === Permanent Anime Girl PFP GIF ===
[MeterPfpContainer]
Meter=Shape
X=#PfpPadding#
Y=#PfpPadding#
Shape=Rectangle 0, 0, #PfpSize#, #PfpSize#, #PfpRadius# | Fill Color 255,255,255,255 | StrokeWidth 0

[MeterPfpGif]
Meter=Image
Container=MeterPfpContainer
X=#PfpPadding#
Y=#PfpPadding#
W=#PfpSize#
H=#PfpSize#
ImageName=#@#Images\Gif\frame_[MeasureGifFrame].png
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureWebState "PlayPause"]
MiddleMouseUpAction=[!WriteKeyValue Variables Scale "(#Scale# >= 1.6 ? 1.0 : (Round((#Scale# + 0.15) * 100) / 100))" "#@#Variables.inc"][!Refresh]

; === Track Title & Artist Text (Anchored to Bottom Baseline) ===
[MeterTrackText]
Meter=String
X=#TextX#
Y=#TitleY#
W=#TextW#
H=#TitleH#
FontFace=#FontFace#
FontSize=#FontSizeTitle#
FontColor=#TextColorPrimary#
FontWeight=600
AntiAlias=1
ClipString=1
MeasureName=MeasureDisplayTitle
LeftMouseUpAction=[!CommandMeasure MeasureWebState "PlayPause"]
MiddleMouseUpAction=[!WriteKeyValue Variables Scale "(#Scale# >= 1.6 ? 1.0 : (Round((#Scale# + 0.15) * 100) / 100))" "#@#Variables.inc"][!Refresh]

[MeterArtistText]
Meter=String
X=#TextX#
Y=#ArtistY#
W=#TextW#
H=#ArtistH#
FontFace=#FontFaceText#
FontSize=#FontSizeArtist#
FontColor=#TextColorSecondary#
FontWeight=400
AntiAlias=1
ClipString=1
MeasureName=MeasureDisplayArtist
LeftMouseUpAction=[!CommandMeasure MeasureWebState "PlayPause"]
MiddleMouseUpAction=[!WriteKeyValue Variables Scale "(#Scale# >= 1.6 ? 1.0 : (Round((#Scale# + 0.15) * 100) / 100))" "#@#Variables.inc"][!Refresh]

; === Audio Spectrum Visualizer — uses Lua-smoothed GetBarHeight() values ===
; BUG FIX: Was bypassing Lua script entirely; now uses physics-smoothed values
[MeterVisualizer]
Meter=Shape
X=#VisualizerX#
Y=#VisualizerY#
W=#VisualizerW#
H=#BarMaxHeight#
DynamicVariables=1
Shape=Rectangle  (0  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(0)]),  #BarWidth#, [&MeasureScript:GetBarHeight(0)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape2=Rectangle (1  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(1)]),  #BarWidth#, [&MeasureScript:GetBarHeight(1)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape3=Rectangle (2  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(2)]),  #BarWidth#, [&MeasureScript:GetBarHeight(2)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape4=Rectangle (3  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(3)]),  #BarWidth#, [&MeasureScript:GetBarHeight(3)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape5=Rectangle (4  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(4)]),  #BarWidth#, [&MeasureScript:GetBarHeight(4)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape6=Rectangle (5  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(5)]),  #BarWidth#, [&MeasureScript:GetBarHeight(5)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape7=Rectangle (6  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(6)]),  #BarWidth#, [&MeasureScript:GetBarHeight(6)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape8=Rectangle (7  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(7)]),  #BarWidth#, [&MeasureScript:GetBarHeight(7)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape9=Rectangle (8  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(8)]),  #BarWidth#, [&MeasureScript:GetBarHeight(8)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape10=Rectangle (9  * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(9)]),  #BarWidth#, [&MeasureScript:GetBarHeight(9)],  #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape11=Rectangle (10 * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(10)]), #BarWidth#, [&MeasureScript:GetBarHeight(10)], #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape12=Rectangle (11 * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(11)]), #BarWidth#, [&MeasureScript:GetBarHeight(11)], #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape13=Rectangle (12 * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(12)]), #BarWidth#, [&MeasureScript:GetBarHeight(12)], #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape14=Rectangle (13 * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(13)]), #BarWidth#, [&MeasureScript:GetBarHeight(13)], #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape15=Rectangle (14 * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(14)]), #BarWidth#, [&MeasureScript:GetBarHeight(14)], #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
Shape16=Rectangle (15 * (#BarWidth# + #BarGap#)), (#BarMaxHeight# - [&MeasureScript:GetBarHeight(15)]), #BarWidth#, [&MeasureScript:GetBarHeight(15)], #BarRadius# | Fill Color #BarColor# | StrokeWidth 0
