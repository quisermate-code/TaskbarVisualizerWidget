[MeasureBar12]
Measure=Calc
Formula=Clamp(Round([MeasureBand12] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar13]
Measure=Calc
Formula=Clamp(Round([MeasureBand13] * #BarMaxHeight#), 2, #BarMaxHeight#)
DynamicVariables=1

[MeasureBar14]
