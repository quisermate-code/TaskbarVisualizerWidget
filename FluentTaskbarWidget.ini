[Rainmeter]
Update=16
AccurateText=1
DynamicWindowSize=1
SkinWidth=#WidgetWidth#
SkinHeight=#WidgetHeight#
Draggable=0

; Right-click Context Menu
ContextTitle="--- Widget Size Controller ---"
ContextTitle2="Size: 100% (Small)"
ContextAction2=[!WriteKeyValue Variables Scale "1.0" "#@#Variables.inc"][!Refresh]
ContextTitle3="Size: 125% (Medium - Recommended)"
ContextAction3=[!WriteKeyValue Variables Scale "1.25" "#@#Variables.inc"][!Refresh]
ContextTitle4="Size: 140% (Large)"
ContextAction4=[!WriteKeyValue Variables Scale "1.40" "#@#Variables.inc"][!Refresh]
ContextTitle5="Size: 160% (Extra Large)"
ContextAction5=[!WriteKeyValue Variables Scale "1.60" "#@#Variables.inc"][!Refresh]
ContextTitle6="Size Up (+10%)"
ContextAction6=[!WriteKeyValue Variables Scale "(Round((#Scale# + 0.10) * 100) / 100)" "#@#Variables.inc"][!Refresh]
ContextTitle7="Size Down (-10%)"
ContextAction7=[!WriteKeyValue Variables Scale "(Round((#Scale# - 0.10) * 100) / 100)" "#@#Variables.inc"][!Refresh]
ContextTitle8="--- GIF to Font Ratio ---"
ContextTitle9="GIF Size: Extra Large"
ContextAction9=[!WriteKeyValue Variables PfpBaseSize "42" "#@#Variables.inc"][!Refresh]
ContextTitle10="GIF Size: Large (Active)"
ContextAction10=[!WriteKeyValue Variables PfpBaseSize "38" "#@#Variables.inc"][!Refresh]
ContextTitle11="GIF Size: Medium"
ContextAction11=[!WriteKeyValue Variables PfpBaseSize "32" "#@#Variables.inc"][!Refresh]
ContextTitle12="--- Taskbar Docking ---"
ContextTitle13="Dock to Right (Before WiFi / Tray)"
ContextAction13=[!WriteKeyValue Variables TaskbarPosition "Right" "#@#Variables.inc"][!Move (#SCREENAREAWIDTH# - #WidgetWidth# - #TaskbarRightOffset#) (#SCREENAREAHEIGHT# - #WidgetHeight# - #TaskbarBottomMargin#)][!Refresh]
ContextTitle14="Dock to Left (Start / Widgets)"
ContextAction14=[!WriteKeyValue Variables TaskbarPosition "Left" "#@#Variables.inc"][!Move #TaskbarLeftOffset# (#SCREENAREAHEIGHT# - #WidgetHeight# - #TaskbarBottomMargin#)][!Refresh]
ContextTitle15="--- Visualizer Color ---"
ContextTitle16="White Visualizer"
ContextAction16=[!WriteKeyValue Variables BarTheme "White" "#@#Variables.inc"][!WriteKeyValue Variables BarColor "255,255,255,240" "#@#Variables.inc"][!WriteKeyValue Variables TextColorPrimary "255,255,255,255" "#@#Variables.inc"][!WriteKeyValue Variables TextColorSecondary "175,175,185,210" "#@#Variables.inc"][!Refresh]
ContextTitle17="Black Visualizer"
ContextAction17=[!WriteKeyValue Variables BarTheme "Black" "#@#Variables.inc"][!WriteKeyValue Variables BarColor "20,20,25,240" "#@#Variables.inc"][!WriteKeyValue Variables TextColorPrimary "20,20,25,255" "#@#Variables.inc"][!WriteKeyValue Variables TextColorSecondary "60,60,70,220" "#@#Variables.inc"][!Refresh]
ContextTitle18="--- Background Style ---"
ContextTitle19="100% Transparent"
ContextAction19=[!WriteKeyValue Variables TransparentMode "1" "#@#Variables.inc"][!WriteKeyValue Variables BgColor "0,0,0,1" "#@#Variables.inc"][!WriteKeyValue Variables BorderColor "0,0,0,0" "#@#Variables.inc"][!Refresh]
ContextTitle20="Frosted Acrylic Glass"
ContextAction20=[!WriteKeyValue Variables TransparentMode "0" "#@#Variables.inc"][!WriteKeyValue Variables BgColor "18,18,24,140" "#@#Variables.inc"][!WriteKeyValue Variables BorderColor "255,255,255,22" "#@#Variables.inc"][!Refresh]
ContextTitle21="Refresh Skin"
ContextAction21=[!CommandMeasure MeasureFetchMedia "Run"][!Refresh]

OnRefreshAction=[!CommandMeasure MeasureFetchMedia "Run"]

[Metadata]
Name=TaskbarVisualizerWidget
Author=Quisermate
Information=Windows 11 Taskbar Media Widget & Audio Visualizer — GIF avatar, scrolling media info, and 16-band Lua-smoothed spectrum.
Version=2.5.0

[Variables]
@include=#@#Variables.inc
@includeMedia=#@#MediaInfo.inc

; Scaled Geometry
PfpSize=(Round(#PfpBaseSize# * #Scale#))
PfpRadius=(Round(#PfpRadius# * #Scale#))
PfpPadding=(Round(2 * #Scale#))
PfpBottom=(#PfpPadding# + #PfpSize#)

WidgetHeight=(#PfpSize# + (Round(5 * #Scale#)))
WidgetWidth=(#PfpSize# + Round(200 * #Scale#))
WidgetRadius=(Round(7 * #Scale#))
; BUG FIX: WidgetBorderWidth was referenced in MeterBackground Shape but never defined
WidgetBorderWidth=1

; Refined Font Sizes
FontSizeTitle=(Round(8.5 * #Scale#))
FontSizeArtist=(Round(7.2 * #Scale#))

; Bottom-Anchored Text Coordinates
TextX=(#PfpSize# + Round(8 * #Scale#))
TextW=(Round(105 * #Scale#))
ArtistH=(Round(14 * #Scale#))
ArtistY=(#PfpBottom# - #ArtistH# - Round(2 * #Scale#))
TitleH=(Round(17 * #Scale#))
TitleY=(#ArtistY# - #TitleH#)

; Bottom-Anchored Visualizer Coordinates
BarMaxHeight=(Round(24 * #Scale#))
VisualizerX=(#TextX# + #TextW# + Round(5 * #Scale#))
VisualizerY=(#PfpBottom# - #BarMaxHeight# - Round(3 * #Scale#))
VisualizerW=(Round(80 * #Scale#))

BarCount=16
BarWidth=(Round(3 * #Scale#))
BarGap=(Round(2 * #Scale#))
BarRadius=(Round(1.5 * #Scale#))

; -------------------------------------------------------------------
; Native Windows 11 FrostedGlass (Inactive in 100% Transparent mode)
; -------------------------------------------------------------------
[MeasureFrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Border=All
Corner=Round
Disabled=(#TransparentMode# = 1 ? 1 : 0)

; -------------------------------------------------------------------
; Windows Master Volume
; -------------------------------------------------------------------
[MeasureWin7Audio]
Measure=Plugin
Plugin=Win7AudioPlugin

; -------------------------------------------------------------------
; Animated GIF Frame Counter (50 frames, ~31 FPS)
; -------------------------------------------------------------------
; BUG FIX: Self-referencing Calc measure requires bracket [MeasureName] notation, not bare name
[MeasureGifFrame]
Measure=Calc
Formula=([MeasureGifFrame] + 1) % #GifTotalFrames#
DynamicVariables=1
UpdateDivider=2

; -------------------------------------------------------------------
; Lua Visualizer Script — smooth physics attack/decay for bar animations
; BUG FIX: Script existed but was never loaded; bars used raw AudioLevel values
; -------------------------------------------------------------------
[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\Visualizer.lua
UpdateDivider=1

; -------------------------------------------------------------------
; Media Metadata & Playback (WebNowPlaying + GSMTC Fallback)
; -------------------------------------------------------------------
[MeasureWebTrack]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
UpdateDivider=5

[MeasureWebArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
UpdateDivider=5

[MeasureWebState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
UpdateDivider=5

; Clean string display logic (Never shows 0)
[MeasureDisplayTitle]
Measure=String
String=[MeasureWebTrack]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^$":"#SMTCTitle#","^0$":"#SMTCTitle#"

[MeasureDisplayArtist]
Measure=String
String=[MeasureWebArtist]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^$":"#SMTCArtist#","^0$":"#SMTCArtist#"

; Background runner for native Windows media sync (Runs every ~2 seconds)
[MeasureFetchMedia]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\FetchMedia.ps1"
State=Hide
UpdateDivider=120
FinishAction=[!UpdateMeasure MeasureDisplayTitle][!UpdateMeasure MeasureDisplayArtist][!UpdateMeter MeterTrackText][!UpdateMeter MeterArtistText][!Redraw]

; -------------------------------------------------------------------
; Audio Spectrum Analyzer (AudioLevel)
; -------------------------------------------------------------------
[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=#FFTSize#
FFTOverlap=#FFTOverlap#
FFTAttack=#FFTAttack#
FFTDecay=#FFTDecay#
Bands=#BarCount#
FreqMin=#FreqMin#
FreqMax=#FreqMax#
Sensitivity=#Sensitivity#

; Band Measures (0 to 15)
[MeasureBand0]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0

[MeasureBand1]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=1

[MeasureBand2]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=2

[MeasureBand3]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=3

[MeasureBand4]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=4

[MeasureBand5]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=5

[MeasureBand6]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=6

[MeasureBand7]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=7

[MeasureBand8]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=8

[MeasureBand9]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=9

[MeasureBand10]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=10

[MeasureBand11]
Measure=Plugin
Plugin=AudioLevel
