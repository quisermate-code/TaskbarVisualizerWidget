[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Fairlady 240Z Behind-the-Car Clock
Author=Antigravity
Information=Sleek, tall 3D depth clock with vertical gradient transparency. Fully draggable.
Version=1.1.0
License=MIT

[Variables]
; -------------------------------------------------------------
; CLOCK CONFIGURATION
; -------------------------------------------------------------

; Time Format: %H:%M for 24-hour (e.g. 16:35), %I:%M for 12-hour
ClockFormat=%H:%M

; Font: Antonio or Bebas Neue (bundled in @Resources\Fonts\)
ClockFontFace=Antonio
ClockFontSize=440

; -------------------------------------------------------------
; CAR THEME VERTICAL GRADIENT (Top -> Middle -> Bottom)
; Top: Bright vibrant neon rose highlight
; Mid: Saturated Fairlady taillight magenta
; Bottom: Deep semi-transparent dark magenta (fades into wallpaper)
; -------------------------------------------------------------
ClockColorTop=255,140,210,240
ClockColorMid=255,45,140,135
ClockColorBottom=220,30,110,15

; -------------------------------------------------------------
; MEASURES
; -------------------------------------------------------------
[MeasureTime]
Measure=Time
Format=#ClockFormat#

; -------------------------------------------------------------
; METERS
; -------------------------------------------------------------

; The Clock String Meter (DirectWrite rendered with vertical gradient)
; SolidColor=0,0,0,1 allows easy clicking/dragging anywhere on the clock area
[MeterTime]
Meter=String
MeasureName=MeasureTime
FontFace=#ClockFontFace#
FontSize=#ClockFontSize#
FontColor=#ClockColorTop#
SolidColor=0,0,0,1
AntiAlias=1
DynamicVariables=1
InlineSetting=GradientColor | 180 | #ClockColorTop# ; 0.0 | #ClockColorMid# ; 0.45 | #ClockColorBottom# ; 1.0
InlinePattern=.*
