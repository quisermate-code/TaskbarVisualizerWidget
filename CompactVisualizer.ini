[Rainmeter]
Update=16
AccurateText=1
DynamicWindowSize=1
SkinWidth=210
SkinHeight=#WidgetHeight#

ContextTitle="Compact Visualizer Settings"
; BUG FIX: ["path"] is not a valid Rainmeter bang — use !EditSkin to open config
ContextAction=[!EditSkin "#@#Variables.inc"]
ContextTitle2="Toggle Acrylic Blur"
ContextAction2=[!ToggleMeasure MeasureFrostedGlass][!Refresh]
ContextTitle3="Switch to Full Widget"
ContextAction3=[!ActivateConfig "#ROOTCONFIG#" "FluentTaskbarWidget.ini"]

[Metadata]
Name=TaskbarVisualizerWidget (Compact)
Author=Quisermate
Information=Minimalist Windows 11 Taskbar Audio Visualizer pill — 20-band spectrum with acrylic blur.
Version=1.1.0

[Variables]
@include=#@#Variables.inc
CompactWidth=210
CompactBarCount=20
CompactBarWidth=6
CompactBarGap=3
CompactBarMaxHeight=24
CompactBarRadius=2
; BUG FIX: WidgetBorderWidth used in Shape but was never defined
WidgetBorderWidth=1
; BUG FIX: Gradient colors referenced in BarGrad but never defined
AccentGradientStart=120,200,255,220
AccentGradientEnd=80,130,255,255

; -------------------------------------------------------------------
; Acrylic Blur
; -------------------------------------------------------------------
[MeasureFrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Border=All
Corner=Round

; -------------------------------------------------------------------
; Master Windows Volume
; -------------------------------------------------------------------
[MeasureWin7Audio]
Measure=Plugin
Plugin=Win7AudioPlugin

; -------------------------------------------------------------------
; Audio Spectrum Analyzer
; -------------------------------------------------------------------
[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=#FFTSize#
FFTOverlap=#FFTOverlap#
FFTAttack=#FFTAttack#
FFTDecay=#FFTDecay#
Bands=#CompactBarCount#
FreqMin=#FreqMin#
FreqMax=#FreqMax#
Sensitivity=#Sensitivity#

; Band Measures (0 to 19)
[MeasureBand0]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0

[MeasureBand1]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=1

