Shape8=Rectangle (7 * (#CompactBarWidth# + #CompactBarGap#)), (#CompactBarMaxHeight# - [MeasureBar7]), #CompactBarWidth#, [MeasureBar7], #CompactBarRadius# | Fill LinearGradient BarGrad | StrokeWidth 0
Shape9=Rectangle (8 * (#CompactBarWidth# + #CompactBarGap#)), (#CompactBarMaxHeight# - [MeasureBar8]), #CompactBarWidth#, [MeasureBar8], #CompactBarRadius# | Fill LinearGradient BarGrad | StrokeWidth 0
Shape10=Rectangle (9 * (#CompactBarWidth# + #CompactBarGap#)), (#CompactBarMaxHeight# - [MeasureBar9]), #CompactBarWidth#, [MeasureBar9], #CompactBarRadius# | Fill LinearGradient BarGrad | StrokeWidth 0
Shape11=Rectangle (10 * (#CompactBarWidth# + #CompactBarGap#)), (#CompactBarMaxHeight# - [MeasureBar10]), #CompactBarWidth#, [MeasureBar10], #CompactBarRadius# | Fill LinearGradient BarGrad | StrokeWidth 0
