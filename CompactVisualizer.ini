; -------------------------------------------------------------------
; METERS
; -------------------------------------------------------------------

; Background Pill & Border
[MeterBackground]
Meter=Shape
X=0
Y=0
W=#CompactWidth#
H=#WidgetHeight#
Shape=Rectangle 0.5, 0.5, (#CompactWidth#-1), (#WidgetHeight#-1), #WidgetRadius# | Fill Color #BgColor# | StrokeWidth #WidgetBorderWidth# | Stroke Color #BorderColor#
MouseScrollUpAction=[!CommandMeasure MeasureWin7Audio "ChangeVolume +2"]
MouseScrollDownAction=[!CommandMeasure MeasureWin7Audio "ChangeVolume -2"]
ToolTipText="Compact Taskbar Visualizer#CRLF#Scroll to adjust volume"

; Centered Visualizer Bars
[MeterVisualizer]
Meter=Shape
X=15
Y=9
W=180
H=24
DynamicVariables=1
Shape=Rectangle (0 * (#CompactBarWidth# + #CompactBarGap#)), (#CompactBarMaxHeight# - [MeasureBar0]), #CompactBarWidth#, [MeasureBar0], #CompactBarRadius# | Fill LinearGradient BarGrad | StrokeWidth 0
Shape2=Rectangle (1 * (#CompactBarWidth# + #CompactBarGap#)), (#CompactBarMaxHeight# - [MeasureBar1]), #CompactBarWidth#, [MeasureBar1], #CompactBarRadius# | Fill LinearGradient BarGrad | StrokeWidth 0
Shape3=Rectangle (2 * (#CompactBarWidth# + #CompactBarGap#)), (#CompactBarMaxHeight# - [MeasureBar2]), #CompactBarWidth#, [MeasureBar2], #CompactBarRadius# | Fill LinearGradient BarGrad | StrokeWidth 0
